# AMCL — map->odom for the mecanum omnibase against the static <map>.yaml grid.
#
# Default localizer of general_navigation.launch.py (NAV_LOCALIZER=slam_toolbox
# switches back to slam_toolbox localization). Loaded into the nav2 container
# next to map_server by nav2_omni.launch.py so the latched /map arrives
# in-process.
#
# TF chain: map -> odom (THIS node) -> base_link (odrive_dashboard).
#
# Tune on the robot: alpha* (odometry noise), the particle counts and
# laser_likelihood_max_dist are the usual knobs.

amcl:
  ros__parameters:
    use_sim_time: False
    robot_model_type: "nav2_amcl::OmniMotionModel"
    # Odometry noise. alpha1/2: rotation from rotation/translation,
    # alpha3/4: translation from translation/rotation, alpha5: strafe (omni).
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan              # merged front+rear scan, already in base_link
    map_topic: map
    first_map_only: True
    tf_broadcast: True
    transform_tolerance: 0.5

    laser_model_type: "likelihood_field"
    laser_max_range: 12.0          # RPLIDAR C1
    laser_min_range: -1.0          # use the scan's range_min
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    do_beamskip: False

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_d: 0.1
    update_min_a: 0.1
    # Random-particle injection off: on symmetric arenas it jumps more than it
    # helps. Relocalizing after an STM32 reconnect is driven by nav_central.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Start at the map origin (same as slam_toolbox's map_start_pose) so map->odom
    # exists before the operator sets the real pose in nav_ui. Without it the
    # Nav2 startup in nav_central waits forever for the TF.
    set_initial_pose: True
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: False
    save_pose_rate: 0.5

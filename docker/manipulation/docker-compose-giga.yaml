# GPU variant. Identical to docker-compose-giga-cpu.yaml except for the
# Dockerfile it builds and the device reservation below, which is what
# requires the nvidia container runtime.
services:
  giga-train:
    container_name: home2-giga-train
    build:
      context: ../..
      dockerfile: docker/manipulation/Dockerfile.giga
    image: roborregos/home2:giga-train
    volumes:
      - ../../:/workspace/src/
      - ./setup_giga.sh:/root/setup_giga.sh
      # Training data / generated datasets / checkpoints live here, outside
      # the repo and the container's writable layer -- can grow to 100GB+.
      - ./giga_data:/workspace/giga_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # NOTE: this container runs as root on purpose. setup_giga.sh does an
    # editable `pip install -e` of vgn at runtime (the source is bind-mounted,
    # so it cannot happen at build time) and dist-packages is not writable by
    # anyone else. run_pipeline.sh hands $GIGA_DATA_ROOT back to the owner of
    # the mount when it finishes, so generated datasets stay deletable from
    # the host.
    working_dir: /workspace/src/manipulation/packages/giga
    tty: true
    stdin_open: true
    command: >
      bash -c "${COMMAND:-/bin/bash}"

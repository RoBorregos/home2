# GIGA training container, CPU version (works on any machine).
# GPU version: docker-compose-giga.yaml

# Own project name so the CPU and GPU containers don't replace each other
# (both files live in the same folder and use the same service name).
name: home2-giga-cpu

services:
  giga-train:
    container_name: home2-giga-train-cpu
    build:
      context: ../..
      dockerfile: docker/manipulation/Dockerfile.giga-cpu
    image: roborregos/home2:giga-train-cpu
    volumes:
      - ../../:/workspace/src/
      - ./setup_giga.sh:/root/setup_giga.sh
      # Datasets, logs and checkpoints (gitignored, can reach 100GB+).
      - ./giga_data:/workspace/giga_data
    # Runs as root so setup_giga.sh can pip-install GIGA. run_pipeline.sh gives
    # the generated data back to your host user when it finishes.
    working_dir: /workspace/src/manipulation/packages/giga
    tty: true
    stdin_open: true
    command: >
      bash -c "${COMMAND:-/bin/bash}"

services:
  ollama:
    profiles: [hric, carry, gpsr, storing, restaurant]
    container_name: home2-hri-ollama-cuda
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.ollama
      args:
        BASE_IMAGE: ${OLLAMA_BASE_IMAGE:-ollama/ollama:0.34.2}
    image: roborregos/home2:hri-ollama-cuda
    runtime: nvidia
    network_mode: host
    volumes:
      - ../../../hri/packages/nlp/assets:/ollama
    environment:
      OLLAMA_MODELS: /ollama
      ROLE: ${ROLE}
    stdin_open: true
    tty: true
    entrypoint:
      ["/bin/bash", "-c", "/scripts/entrypoint.sh && tail -f /dev/null"]

# Benchmark overrides for the existing HRI llama.cpp and Ollama services.
# Load this after llamacpp-l4t.yaml and ollama-l4t.yaml so the benchmark uses
# the same images, GPU configuration, network, and model volume as production.
services:
  llama:
    profiles: [bench]
    environment:
      ROLE: bench
      LLAMA_MODEL_FILE: ${LLAMA_MODEL_FILE:-}
      LLAMA_ALIAS: ${LLAMA_ALIAS:-qwen3}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-2048}

  ollama:
    profiles: [bench]
    volumes:
      - /usr/lib/aarch64-linux-gnu/tegra:/usr/lib/aarch64-linux-gnu/tegra
      - ../scripts/ollama-bench-entrypoint.sh:/scripts/bench-entrypoint.sh
    environment:
      ROLE: bench
      LLAMA_MODEL_FILE: ${LLAMA_MODEL_FILE:-}
      LLAMA_ALIAS: ${LLAMA_ALIAS:-qwen3}
      LLAMA_CTX_SIZE: ${LLAMA_CTX_SIZE:-2048}
      BENCH_PORT: "11434"
      # Match llama.cpp's flash-attention, q8_0 KV cache, and one request slot.
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    entrypoint: ["/bin/bash", "/scripts/bench-entrypoint.sh"]

services:
  postgres:
    image: roborregos/home2:hri-postgres-${ENV_TYPE:-cpu}
    build:
      context: ..
      dockerfile: dockerfiles/Dockerfile.postgres
    container_name: home2-hri-postgres-${ENV_TYPE:-cpu}
    restart: "no"
    # Postgres logs its routine startup/shutdown at LOG, which ranks above WARNING,
    # so no log_min_messages value hides them without also hiding ERRORs.
    # Keep it out of the attached stream instead; `docker logs` still has everything.
    attach: false
    environment:
      POSTGRES_USER: rbrgs
      POSTGRES_PASSWORD: rbrgs
      POSTGRES_DB: postgres
    network_mode: host
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

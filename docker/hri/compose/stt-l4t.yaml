services:
  stt:
    profiles: [hric, carry, gpsr, storing, restaurant]
    container_name: home2-hri-stt-l4t
    image: roborregos/home2:hri-stt-l4t
    runtime: nvidia
    build:
      context: ../../..
      dockerfile: docker/hri/dockerfiles/Dockerfile.stt-l4t
    volumes:
      - ../../../hri/microservices/stt/:/app
      - ../../../hri/packages/speech/speech/:/app/speech
    network_mode: host
    # English: distil-large-v3. Multilingual transcription: large-v3-turbo.
    # Translation to English needs a compatible model such as large-v3.
    command: >
      python3 -u faster-whisper-streaming.py --port 50051
      --model ${STT_MODEL:-distil-large-v3} --language ${STT_LANGUAGE:-en}
      --task ${STT_TASK:-transcribe} --log_transcriptions

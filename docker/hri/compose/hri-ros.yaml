# Speech variables
x-speech-devices: &speech-devices
  PULSE_SERVER: unix:/tmp/pulse/native
  PULSE_COOKIE: /tmp/pulse-cookie/cookie
  SDL_AUDIODRIVER: pulse

services:
  hri-ros:
    container_name: home2-hri-ros-${ENV_TYPE:-cpu}
    build:
      context: ../../..
      dockerfile: docker/hri/dockerfiles/Dockerfile.ROS
      args:
        BASE_IMAGE: roborregos/home2:${ENV_TYPE:-cpu}_base
    image: roborregos/home2:hri-${ENV_TYPE:-cpu}
    runtime: ${RUNTIME:-runc}
    volumes:
      - ../../../:/workspace/src
      - /run/user/${LOCAL_USER_ID:-1000}/pulse:/tmp/pulse
      - ~/.config/pulse:/tmp/pulse-cookie
      - ../build:/workspace/build
      - ../install:/workspace/install
      - ../log:/workspace/log
      - ../../frida_interfaces_cache:/workspace/frida_interfaces_cache
    network_mode: host
    user: ${LOCAL_USER_ID:-1000}:${LOCAL_GROUP_ID:-1000}
    privileged: true
    group_add:
      - video
      - audio
    environment:
      <<:
        - *speech-devices
      DISPLAY: ${DISPLAY:-:0}
      TERM: xterm-256color
      CYCLONE_INTERFACE: ${CYCLONE_INTERFACE:-}
      # Startup log noise. HRI_LOG_LEVEL=debug brings every node's init details back.
      HRI_LOG_LEVEL: ${HRI_LOG_LEVEL:-info}
      PYGAME_HIDE_SUPPORT_PROMPT: 1
      TRANSFORMERS_VERBOSITY: error
      # The base torch wheel isn't built for sm_87; it still runs, this only hides the notice.
      PYTHONWARNINGS: "ignore:Found GPU0:UserWarning"
    env_file:
      - .env
    tty: true
    entrypoint: ["bash", "-il", "-c"]
    command: ["${COMMAND:-/bin/bash}"]

[global]
# PyPI only: the jetson-ai-lab sbsa/cu130 wheels are built for Thor/Spark
# (sm_110/sm_121) and don't run on Orin. onnxruntime-gpu, the one Jetson wheel we
# use, is installed by URL in Dockerfile.ROS-l4t.
index-url = https://pypi.org/simple
constraint = /etc/pip/constraints.txt
no-cache-dir = true
disable-pip-version-check = true

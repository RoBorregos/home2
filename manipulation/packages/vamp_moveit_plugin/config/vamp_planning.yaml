# Overrides for the "vamp" pipeline, applied on top of the OMPL pipeline whose planner configs the fallback reads
planning_plugins:
  - vamp_moveit_plugin/VampPlannerManager
service_name: /vamp_server/plan
end_effector_link: link_eef
# Seconds to wait for the VAMP server before planning with OMPL
request_timeout: 2.0
# OMPL replans when its timed path fails validation
fallback_attempts: 4

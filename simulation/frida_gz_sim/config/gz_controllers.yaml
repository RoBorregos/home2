controller_manager:
  ros__parameters:
    update_rate: 200
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    xarm6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    xarm_gripper_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

xarm6_traj_controller:
  ros__parameters:
    use_sim_time: true
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.0
      joint1: {trajectory: 0.0, goal: 0.05}
      joint2: {trajectory: 0.0, goal: 0.05}
      joint3: {trajectory: 0.0, goal: 0.05}
      joint4: {trajectory: 0.0, goal: 0.05}
      joint5: {trajectory: 0.0, goal: 0.05}
      joint6: {trajectory: 0.0, goal: 0.05}

xarm_gripper_traj_controller:
  ros__parameters:
    use_sim_time: true
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - rightfinger
      - leftfinger
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      goal_time: 0.0
      stopped_velocity_tolerance: 0.0
      rightfinger: {trajectory: 0.0, goal: 0.0}
      leftfinger: {trajectory: 0.0, goal: 0.0}

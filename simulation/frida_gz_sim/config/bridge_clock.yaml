# Sim clock alone in its own parameter_bridge process, so heavy sensor streams in
# bridge.yaml (camera images, point cloud) can never block it. Every node runs on
# use_sim_time, so a stalled /clock freezes all of their timers.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

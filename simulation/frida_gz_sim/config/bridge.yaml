# gz -> ROS topic map; ROS names match the real ZED wrapper topics in frida_constants
# /clock is bridged by its own process (bridge_clock.yaml): sharing one with the
# camera images and cloud let a slow reliable image reader stall /clock for minutes,
# freezing every sim-time timer (nav_central never left its first setup step).
- ros_topic_name: /zed/zed_node/rgb/color/rect/image
  gz_topic_name: /zed_rgbd/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /zed/zed_node/rgb/image_rect_color
  gz_topic_name: /zed_rgbd/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /zed/zed_node/depth/depth_registered
  gz_topic_name: /zed_rgbd/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS

- ros_topic_name: /zed/zed_node/depth/camera_info
  gz_topic_name: /zed_rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

- ros_topic_name: /zed/zed_node/rgb/camera_info
  gz_topic_name: /zed_rgbd/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS

- ros_topic_name: /zed_rgbd/points_raw
  gz_topic_name: /zed_rgbd/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true

- ros_topic_name: /sim/overview_camera/image
  gz_topic_name: /overview_camera/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true

# RoboCup@Home 2026 rulebook, 5.2 Pick and Place Challenge (max 7:00 minutes).
# count = how many times a row can score; simulated: false rows are reported, never scored.
task: ppc
time_limit_s: 420
rows:
  - {id: navigate_to_table, label: "Navigate to the table", points: 15, count: 1}
  - {id: recognize_object, label: "Correctly recognize an object", points: 10, count: 12}
  - {id: shelf_placement_indicated, label: "Perceive objects on a shelf and indicate the correct placement", points: 30, count: 2}
  - {id: pick, label: "Picking up an object for transportation", points: 50, count: 12}
  - {id: first_pick, label: "First Pick Bonus", points: 100, count: 1}
  - {id: pick_floor, label: "Pick from the floor", points: 30, count: 1}
  - {id: pick_cutlery, label: "Pick cutlery", points: 50, count: 2}
  - {id: pick_plate, label: "Pick plate", points: 100, count: 1}
  - {id: pick_tab, label: "Pick dishwasher tab", points: 100, count: 1, simulated: false}
  - {id: pick_common, label: "Pick common object from auxiliary table", points: -20, count: 2}
  - {id: place, label: "Place an object in its designated location", points: 40, count: 12}
  - {id: place_dishwasher, label: "Correctly in the dishwasher", points: 70, count: 3, simulated: false}
  - {id: place_similar, label: "Next to similar objects in the cabinet", points: 20, count: 2}
  - {id: breakfast_area_dirty, label: "Area around breakfast items is not cleaned", points: -30, count: 4}
  - {id: place_tab, label: "In the dishwasher tab slot", points: 160, count: 1, simulated: false}
  - {id: place_common, label: "Place common object from auxiliary table", points: -20, count: 2}
  - {id: rack, label: "Pull or push the dishwasher rack", points: 100, count: 2, simulated: false}
  - {id: door, label: "Open or close the dishwasher door without assistance", points: 200, count: 2, simulated: false}
  - {id: open_milk, label: "Open milk container without assistance", points: 400, count: 1, simulated: false}
  - {id: pour, label: "Pour cereal or milk into the bowl without assistance", points: 200, count: 2, simulated: false}
  - {id: thrown, label: "Objects thrown or dropped while placing", points: -40, count: 12}
  - {id: breakfast_not_typical, label: "Breakfast not served in a typical meal setting", points: -50, count: 1}
  - {id: dropped_floor, label: "Objects dropped on the floor", points: -40, count: 12}

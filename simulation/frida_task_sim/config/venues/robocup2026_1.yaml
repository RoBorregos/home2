# Kitchen furniture for the robocup2026_1 map, in map coordinates (m).
# Each furniture sits in front of the matching sublocation of areas_robocup2026_1.json.
map_name: robocup2026_1
# Outside the kitchen, facing the arena door [x, y, z, yaw]
spawn: [4.20, -11.90, 0.02, -1.5708]
# Closed arena door in front of the start pose; the referee opens it after the start signal
door:
  center: [4.30, -13.20]
  size: [2.60, 0.05]
  opens_after_s: 5.0

# Wall boxes of the map inside these rectangles [x_min, y_min, x_max, y_max] are dropped:
# the lidar mapped the real furniture there and the models below replace it.
carve:
  - [-1.10, -14.75, 0.30, -13.35]   # dining table
  - [0.45, -12.00, 1.75, -11.25]    # cabinet
  - [-3.30, -13.80, -2.75, -12.05]  # counter along the west wall

furniture:
  dinner_table:
    shape: box
    center: [-0.40, -13.85]
    size: [1.20, 0.80]
    height: 0.75
    colour: [0.62, 0.46, 0.30]
    # Strip of the top the docked robot can reach [x_min, y_min, x_max, y_max]
    reach: [-0.85, -13.74, 0.05, -13.50]
  counter:
    shape: box
    center: [-3.00, -12.92]
    size: [0.40, 1.60]
    height: 0.75
    colour: [0.80, 0.80, 0.78]
    reach: [-2.98, -12.75, -2.86, -12.25]
  dishwasher:
    shape: box
    center: [-2.75, -15.35]
    size: [0.60, 0.70]
    height: 0.75
    colour: [0.85, 0.85, 0.88]
    reach: [-2.74, -15.60, -2.52, -15.10]
  trash:
    shape: bin
    center: [0.70, -15.62]
    radius: 0.17
    height: 0.35
    colour: [0.20, 0.20, 0.22]
  cabinet:
    shape: shelf
    center: [1.10, -11.62]
    size: [1.00, 0.40]
    # Open side faces -y (the robot stands south of it)
    front: [0.0, -1.0]
    levels: [0.095, 0.39, 0.70, 1.05]
    height: 1.40
    colour: [0.55, 0.40, 0.26]

# PPC roles -> furniture
ppc:
  table: dinner_table
  extra_surface: counter
  breakfast_surface: dishwasher
  cabinet: cabinet
  dishwasher: dishwasher
  trash: trash
  floor_trash: [0.45, -15.35]

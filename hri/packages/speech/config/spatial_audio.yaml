spatial_audio:
  ros__parameters:
    MULTICHANNEL_AUDIO_TOPIC: REPLACE
    # devices_launch.py points this at PROCESSED_AUDIO_TOPIC when
    # HRI_AUDIO_FRONTEND=spatial (then it replaces noise_cancellation)
    ENHANCED_AUDIO_TOPIC: REPLACE
    SAYING_TOPIC: REPLACE
    MC_CHANNELS: 6
    USE_MVDR: true
    USE_DFN: true
    # ReSpeaker noise study: the WER optimum of the DFN limit is 3-6 dB; 12 already
    # costs +2.6 WER points on a raw mic; never 0 (= unlimited in DF).
    DF_ATTEN_LIM_DB: 6.0
    DFN_BLOCK_SEC: 0.256
    DFN_CONTEXT_SEC: 1.0
    HPF_HZ: 100.0
    VAD_INPUT_GAIN_DB: 12.0
    OUTPUT_GAIN_DB: 12.0
    MVDR_NOISE_TAU_SEC: 3.0
    MVDR_SPEECH_TAU_SEC: 1.5
    STATS_PERIOD_SEC: 30.0

speaker_verification:
  ros__parameters:
    # Topics (REPLACE = value from frida_constants.hri_constants)
    MULTICHANNEL_AUDIO_TOPIC: REPLACE  # 6 ReSpeaker channels from audio_capturer
    RAW_AUDIO_TOPIC: REPLACE           # mono fallback when there is no ReSpeaker
    SPEAKER_ID_LOCATED_TOPIC: REPLACE  # output: who spoke + from where (JSON)
    SPEAKER_ID_COMMAND_TOPIC: REPLACE  # enroll / forget / set_target (JSON)
    SPEAKER_ID_STATUS_TOPIC: REPLACE   # replies to commands (JSON, latched)
    SAYING_TOPIC: /saying              # robot TTS active -> mute
    SAMPLE_RATE: 16000
    MC_CHANNELS: 6

    # Embeddings on the RTF-MVDR beam of the raw mics ("mvdr") or on one channel
    # ("channel" + MONO_CHANNEL). Lab eval 2026-11-21: genuine min score 0.46 on
    # the chip's ch0 -> 0.59 on MVDR, d' 7.7 -> 9.5. Profiles must be enrolled on
    # the same source.
    MONO_SOURCE: "mvdr"
    MONO_CHANNEL: 0
    MVDR_OUTPUT_GAIN_DB: 10.0

    # Direction (SRP-PHAT on ch1-4). Robot frame: 0 = front, +90 = left,
    # -90 = right. Calibrated on FRIDA 2026-11-21; re-check if the ReSpeaker is
    # remounted or rotated (hri/benchmarks/speaker_id/evaluate.py doa).
    DOA_OFFSET_DEG: -15.0
    DOA_MIRROR: false
    DOA_MIN_CONF: 0.15
    # An unsure voice coming from where a person was identified in the last
    # TRACK_MAX_AGE_SEC (within TRACK_MATCH_DEG) is attributed to that person.
    TRACK_MAX_AGE_SEC: 8.0
    TRACK_MATCH_DEG: 25.0

    # Models / data ("" = defaults under hri/packages/speech/assets)
    SILERO_MODEL: ""
    EMBED_MODEL: ""                    # assets/downloads/speaker_id/voxceleb_resnet34_LM.onnx
    EMBED_BACKEND: "wespeaker_resnet34_lm"
    ORT_PROVIDERS: "cuda,cpu"
    PROFILE_DIR: ""                    # assets/downloads/speaker_id/profiles

    # VAD / segmentation
    VAD_ON: 0.5
    VAD_OFF: 0.4
    ENERGY_MARGIN_DB: 3.0
    NOISE_FLOOR_TAU_SEC: 3.0
    MIN_SPEECH_SEC: 0.25
    MIN_SILENCE_SEC: 0.5
    PAD_SEC: 0.2
    MAX_SEGMENT_SEC: 15.0
    TTS_TAIL_SEC: 0.3

    # Verification. Calibrated in the lab (noisy, 2026-11-07 and 2026-11-21):
    # 0 of 31 impostor segments accepted (max 0.30), target 0.38-0.67 at ~1 m.
    TARGET_NAME: ""                    # "" = any enrolled person counts as target
    EMBED_MIN_SEC: 1.0
    EMBED_HOP_SEC: 0.5                 # partial decision period
    EMBED_WIN_SEC: 1.5                 # partial window: who is speaking now
    EMBED_MAX_SEC: 6.0
    ACCEPT_TH: 0.38
    REJECT_TH: 0.24
    MARGIN: 0.10
    ADAPT: true
    ADAPT_TH: 0.65
    ADAPT_MIN_SEC: 2.0
    POOL_MAX: 10

    # Enrollment
    ENROLL_MIN_SEC: 3.0
    ENROLL_GOOD_SEC: 6.0
    ENROLL_OUTLIER_TH: 0.45
    ENROLL_TIMEOUT_SEC: 90.0
    LOOKBACK_SEC: 30.0

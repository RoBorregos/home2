services:
  ros2-build:
    build: .
    container_name: local-ci-ros2-build
    volumes:
      - ../:/ros2_ws
    # add --progress=plain to avoid buffering
    command: ["/bin/bash", "-c", "source /opt/ros/jazzy/setup.sh && ./.github/workflows/setup.sh && export GPD_INSTALL_DIR=/ros2_ws/install/gpd && export GITHUB_ACTIONS=false && colcon build --symlink-install --packages-ignore realsense_gazebo_plugin xarm_gazebo vamp_moveit_plugin"]
name: Task simulation tests

# Scenario generation and scoring only: no Gazebo, runs on hosted runners
on:
  pull_request:
    paths:
      - "simulation/**"
      - "frida_constants/**"
      - "navigation/packages/map_context/**"
      - ".github/workflows/sim-tests.yml"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    container:
      image: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: Build the packages the tests import
        run: |
          . /opt/ros/jazzy/setup.sh
          colcon build --packages-select frida_constants frida_gz_sim frida_task_sim

      - name: Test
        run: |
          . /opt/ros/jazzy/setup.sh && . install/setup.sh
          apt-get update && apt-get install -y python3-pytest python3-numpy python3-yaml
          export FRIDA_MAPS_DIR="$PWD/navigation/packages/map_context/maps"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q simulation/frida_task_sim/test

name: Task simulation

# Full Gazebo runs need a GPU and the 18 GB sim image, so they run on a self-hosted
# runner. The repo is public: never add pull_request here, forks could run code on it.
on:
  schedule:
    - cron: "0 9 * * *" # 03:00 Monterrey
  workflow_dispatch:
    inputs:
      tasks:
        description: "Comma-separated tasks"
        default: "ppc"
      seeds:
        description: "Comma-separated seeds"
        default: "1,2,3"

concurrency:
  group: task-simulation
  cancel-in-progress: false

jobs:
  suite:
    runs-on: [self-hosted, frida-sim]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The container mounts the checkout it was created from; recreate it for this one
      - name: Build the workspace
        run: |
          ./run.sh simulation --down || true
          ./run.sh simulation --build

      - name: Run the suite
        run: |
          ./run.sh simulation --suite \
            --tasks "${{ inputs.tasks || 'ppc' }}" \
            --seeds "${{ inputs.seeds || '1,2,3' }}" \
            --out /workspace/sim_logs/runs/ci_${{ github.run_id }}

      - name: Summary
        if: always()
        run: cat docker/simulation/logs/runs/ci_${{ github.run_id }}/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-sim-${{ github.run_id }}
          path: docker/simulation/logs/runs/ci_${{ github.run_id }}
          retention-days: 14

      - name: Stop the container
        if: always()
        run: ./run.sh simulation --down || true
